<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TelegramAll Android preview</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #dfe3e8;
      font: 14px/1.4 system-ui, sans-serif;
      color: #333;
    }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    .toolbar button, .toolbar select, .toolbar a {
      padding: 6px 12px;
      border: 1px solid #b8bfc7;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .phone {
      position: relative;
      width: 412px;
      height: min(915px, calc(100vh - 90px));
      overflow: hidden;
      border: 10px solid #111;
      border-radius: 42px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    /* a status bar and a home indicator like the emulator's; they invert over light and dark screens */
    .status, .home { position: absolute; z-index: 2; pointer-events: none; color: #fff; mix-blend-mode: difference; }
    .status { top: 0; left: 0; right: 0; height: 24px; padding: 3px 14px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; }
    .home { bottom: 6px; left: 50%; width: 130px; height: 5px; margin-left: -65px; border-radius: 3px; background: #fff; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="reload">Reload</button>
    <select id="size">
      <option value="412x915">Pixel 7 · 412×915</option>
      <option value="360x780">Small · 360×780</option>
      <option value="393x852">393×852</option>
    </select>
    <a href="/android.html" target="_blank">Open full tab</a>
  </div>
  <div class="phone" id="phone">
    <div class="status"><span id="clock">9:41</span><span>▮▮▮ 5G ▭</span></div>
    <iframe id="app" allow="clipboard-read; clipboard-write; microphone; camera"></iframe>
    <div class="home"></div>
  </div>
  <script>
    // the app reads this to switch to the Android version (the frame shares it with this page)
    sessionStorage.setItem('forceAndroid', '1');
    document.getElementById('app').src = '/';
    const phone = document.getElementById('phone');
    const app = document.getElementById('app');
    document.getElementById('reload').onclick = () => app.contentWindow.location.reload();
    document.getElementById('size').onchange = (e) => {
      const [w, h] = e.target.value.split('x');
      phone.style.width = (+w + 20) + 'px';
      phone.style.height = 'min(' + (+h + 20) + 'px, calc(100vh - 90px))';
    };
    const tick = () => {
      const d = new Date();
      document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
    };
    tick();
    setInterval(tick, 20000);
  </script>
</body>
</html>
